[project]
name = "tmc-multiagent"
version = "0.1.0"
description = "Sistema Multiagente SaaS para TMCs (Transporte, Alojamiento, Agenda) - MVP costo cero"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "redis==8.1.0",
    "sqlmodel==0.0.39",
    "streamlit==1.61.1",
    "semantic-kernel==1.44.1",
    "python-dotenv==1.2.2",
    "langgraph==1.2.11",
    "langchain-groq==1.1.3",
    "fpdf2==2.8.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs", "services"]
